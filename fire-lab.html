const SCENARIOS=[

function simulate(params){
  const p={...DEF,...params};
  const hfR=p.hfroi/100/12,reR=p.reapp/100/12,infR=p.inf/100/12,helocR=p.heloc_rate/100/12;
  let hf=p.hfbal,tiaa=p.tiaabal;
  let vV=p.vineta,vM=p.vineta_mort;
  let pV=p.paulval,pM=p.paul_mort+p.paul_heloc;
  let pSold=false,tiaMoved=false,pSoldM=null;
  let helocDrawn=p.heloc_balance;
  const helocCap=p.heloc_max;
  const sdiS=p.jpl_months+p.pto_months+1;
  const sdiE=p.jpl_months+p.pto_months+p.sdi_months;
  const tiaaM=sdiE+1;
  const ot={6:20000,9:13000,18:40000,30:40000,42:40000,54:20000};
  const tl=[];

  for(let m=1;m<=120;m++){
    tiaa*=(1+(p.tiaaroi||p.hfroi)/100/12); // TIAA grows at its own ROI until transfer
    hf=hf*(1+hfR); // grow HF on previous balance ONLY
    if(!tiaMoved&&m===tiaaM){hf+=tiaa;tiaa=0;tiaMoved=true;} // TIAA added AFTER growth
    if(m===p.jpl_months+p.pto_months+1&&p.pto_lump>0)hf+=p.pto_lump; // lump sum PTO payout after PTO period ends
    if(p.biz_acquire>0&&m===p.biz_acquire_month)hf-=p.biz_acquire;
    const jI=m<=p.jpl_months?p.jpl_net:0;
    const pI=m>p.jpl_months&&m<=p.jpl_months+p.pto_months?p.pto_net:0;
    const sI=m>=sdiS&&m<=sdiE?p.sdi:0;
    const bI=m>=p.bizstart?p.biz:0;
    const rI=!pSold&&m>=p.rent_start?p.rent*Math.pow(1+0.05/12,m-p.rent_start):0;
    const gI=m<=p.gift_end?p.gift:0;
    let tI=0;
    if(m===p.tax_return_month)tI=p.tax_return;
    else if(m===p.tax_return_month+12)tI=p.tax_return*0.9;
    else if(m===p.tax_return_month+24)tI=p.tax_return*0.75;
    let dRent=0;
    if(m>=p.detroit_start){
      let dTot=0;
      for(let t=p.detroit_start;t<=m;t+=p.detroit_freq){
        const u=Math.min(p.detroit_units,p.detroit_max_units-dTot);
        if(u<=0)break;
        if(m===t)hf-=u*p.detroit_unit_cost;
        dTot+=u;
        dRent+=u*p.detroit_unit_cost*0.15/12*Math.pow(1+0.05/12,m-t);
      }
    }
    const totI=jI+pI+sI+bI+rI+gI+dRent+tI;
    const hE=!pSold?helocDrawn*helocR:0;
    const bE=p.spend*Math.pow(1+infR,m-1)-(m>=p.redmonth?p.redamt:0);
    const totE=bE+p.vmort+(pSold?0:p.pmort)+hE+(ot[m]||0);
    const cf=totI-totE;
    if(p.sellpaul&&!pSold&&m===p.sellmonth){pSold=true;hf+=Math.max(0,pV-pM-140000);pM=0;pV=0;}
    if(p.hfFloorSell&&!pSold&&pV>0&&hf<50000){pSold=true;pSoldM=m;hf+=Math.max(0,pV-pM-140000);pM=0;pV=0;}
    let cfRem=cf;
    if(cfRem<0&&helocDrawn<helocCap){const d=Math.min(-cfRem,helocCap-helocDrawn);helocDrawn+=d;cfRem+=d;} // deficit: draw HELOC first (remainder hits HF if maxed)
    else if(cfRem>0&&helocDrawn>0){const d=Math.min(cfRem,helocDrawn);helocDrawn-=d;cfRem-=d;} // surplus: pay HELOC down, remainder to HF
    hf+=cfRem; // HF growth already applied above; only add CF remainder here
    vV*=(1+reR);vM=Math.max(0,vM-1500);
    if(!pSold){pV*=(1+reR);pM=Math.max(0,pM-1200);}
    const passive=bI+rI+gI+dRent+(hf>0?hf*hfR:0); // FIRE = permanent passive only (no W2/PTO/SDI)
    const nw=hf+tiaa+(vV-vM)*p.vineta_share+(pSold?0:Math.max(0,pV-pM));
    const helocAvail=Math.max(0,helocCap-helocDrawn);
    const fr=Math.min(totE>0?passive/totE:0,2);
    tl.push({m,totI,totE,cf,passive,nw,liqHF:hf,liq:hf+helocAvail,helocDrawn,helocAvail,fr,pSold,
      inc:{jI,pI,sI,bI,rI,gI,dRent,tI},exp:{bE,vE:p.vmort,pE:pSold?0:p.pmort,hE,oE:ot[m]||0}});
  }
  let fireM=null;
  for(let i=0;i<tl.length-2;i++){if(tl[i].fr>=1&&tl[i+1].fr>=1&&tl[i+2].fr>=1){fireM=i+1;break;}}
  let loLiqHF=Infinity,loMHF=tiaaM,loLiq=Infinity,loM=tiaaM,brokeM=null;
  tl.forEach((s,i)=>{
    if(i>=tiaaM){if(s.liqHF<loLiqHF){loLiqHF=s.liqHF;loMHF=i+1;}if(s.liq<loLiq){loLiq=s.liq;loM=i+1;}}
    if(!brokeM&&s.liqHF<=0)brokeM=i+1;
  });
  const helocMaxIdx=tl.findIndex(s=>s.helocDrawn>=helocCap*0.999);
  const preWarn=helocMaxIdx>=0&&helocMaxIdx<tiaaM;
  return{tl,fireM,pSoldM,finalNW:tl[119].nw,finalFR:tl[119].fr,loLiqHF,loMHF,loLiq,loM,brokeM,preWarn,helocMaxM:helocMaxIdx>=0?helocMaxIdx+1:null};
}

function Chart({data,color,data2,color2,height=120,markers=[],showZero,scrubIdx,onScrub}){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
    const w=c.offsetWidth,h=height;
    c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
    if(!data||!data.length)return;
    const all=[...data,...(data2||[])];
    const mn=Math.min(showZero?0:Math.min(...all),...all);
    const mx=Math.max(...all,mn+1);
    const rng=mx-mn;
    const pd={t:8,b:22,l:8,r:8};
    const tx=i=>pd.l+(i/(data.length-1))*(w-pd.l-pd.r);
    const ty=v=>pd.t+(1-(v-mn)/rng)*(h-pd.t-pd.b);

    // Grid lines
    const gridLevels=4;
    for(let i=0;i<=gridLevels;i++){
      const v=mn+(rng/gridLevels)*i;
      const y=ty(v);
      ctx.beginPath();ctx.moveTo(pd.l,y);ctx.lineTo(w-pd.r,y);
      ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.stroke();
      if(i>0&&i<gridLevels){
        ctx.fillStyle='rgba(144,144,168,0.35)';ctx.font='8px monospace';
        ctx.textAlign='right';
        const label=Math.abs(v)>=1000000?'$'+(v/1000000).toFixed(1)+'M':Math.abs(v)>=1000?'$'+(v/1000).toFixed(0)+'K':'$'+Math.round(v);
        ctx.fillText(label,pd.l+36,y-2);
      }
    }

    // Zero line
    if(showZero&&mn<0){
      const y=ty(0);
      ctx.beginPath();ctx.moveTo(pd.l,y);ctx.lineTo(w-pd.r,y);
      ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
    }

    const drawSeries=(d,col,fill)=>{
      if(!d)return;
      if(fill){
        const gr=ctx.createLinearGradient(0,pd.t,0,h-pd.b);
        gr.addColorStop(0,col+'40');gr.addColorStop(0.6,col+'10');gr.addColorStop(1,col+'00');
        ctx.beginPath();ctx.moveTo(tx(0),ty(d[0]));
        for(let i=1;i<d.length;i++){
          const x0=tx(i-1),y0=ty(d[i-1]),x1=tx(i),y1=ty(d[i]);
          const cpx=(x0+x1)/2;
          ctx.bezierCurveTo(cpx,y0,cpx,y1,x1,y1);
        }
        ctx.lineTo(tx(d.length-1),h-pd.b);ctx.lineTo(tx(0),h-pd.b);
        ctx.closePath();ctx.fillStyle=gr;ctx.fill();
      }
      ctx.beginPath();ctx.moveTo(tx(0),ty(d[0]));
      for(let i=1;i<d.length;i++){
        const x0=tx(i-1),y0=ty(d[i-1]),x1=tx(i),y1=ty(d[i]);
        const cpx=(x0+x1)/2;
        ctx.bezierCurveTo(cpx,y0,cpx,y1,x1,y1);
      }
      ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
    };

    drawSeries(data,color,true);
    if(data2)drawSeries(data2,color2||'#F87171',false);

    // Markers
    (markers||[]).filter(mk=>mk.month>=1&&mk.month<=120).forEach(({month:mo,color:mc,label:lb})=>{
      const x=tx(mo-1);
      ctx.beginPath();ctx.moveTo(x,pd.t);ctx.lineTo(x,h-pd.b);
      ctx.strokeStyle=mc+'90';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=mc;ctx.font='bold 8px monospace';
      ctx.textAlign=x>w*0.75?'right':'left';
      ctx.fillText(lb,x+(x>w*0.75?-3:3),pd.t+8);
    });

    // X axis labels
    ctx.fillStyle='rgba(90,90,114,0.7)';ctx.font='8px monospace';
    [0,29,59,89,119].forEach(i=>{
      ctx.textAlign=i===0?'left':i===119?'right':'center';
      ctx.fillText(MS(i+1),tx(i),h-5);
    });

    // Scrub line
    if(scrubIdx!=null&&scrubIdx>=0&&scrubIdx<data.length){
      const x=tx(scrubIdx),y=ty(data[scrubIdx]);
      ctx.save();
      ctx.beginPath();ctx.moveTo(x,pd.t);ctx.lineTo(x,h-pd.b);
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
      ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.fill();ctx.stroke();
      ctx.restore();
    }
  },[data,data2,color,color2,height,markers,showZero,scrubIdx]);
  return <canvas ref={ref} onClick={e=>{if(!onScrub)return;const c=ref.current;if(!c)return;const r=c.getBoundingClientRect();onScrub(Math.max(0,Math.min(119,Math.round(((e.clientX-r.left)/r.width)*119))));}} style={{width:'100%',height,display:'block',cursor:onScrub?'crosshair':'default'}}/>;
}


function MultiChart({results,cur,scenarios}){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
    const w=c.offsetWidth,h=c.offsetHeight;
    c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
    const all=Object.values(results).flatMap(r=>r.tl.map(s=>s.nw));
    const mx=Math.max(...all,1),pd={t:10,b:20,l:2,r:2};
    const tx=i=>pd.l+(i/119)*(w-pd.l-pd.r),ty=v=>pd.t+(1-v/mx)*(h-pd.t-pd.b);
    scenarios.forEach(sc=>{
      const r=results[sc.id];if(!r)return;
      const vals=r.tl.map(s=>s.nw),isCur=sc.id===cur;
      ctx.beginPath();ctx.moveTo(tx(0),ty(vals[0]));vals.forEach((v,i)=>{if(i)ctx.lineTo(tx(i),ty(v));});
      ctx.strokeStyle=sc.color+(isCur?'ff':'50');ctx.lineWidth=isCur?2.5:1.2;ctx.stroke();
      if(isCur){ctx.fillStyle=sc.color+'cc';ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText(FC(vals[119]),tx(119)-2,ty(vals[119])-4);}
    });
    ctx.fillStyle='rgba(144,144,168,0.45)';ctx.font='9px monospace';
    [0,29,59,89,119].forEach(i=>{ctx.textAlign=i===0?'left':i===119?'right':'center';ctx.fillText(MS(i+1),tx(i),h-4);});
  },[results,cur]);
  return <canvas ref={ref} style={{width:'100%',height:'100%',display:'block'}}/>;
}

function Sl({label,sub,k,min,max,step,value,onUpd,fmt}){
  return(
    <div style={{padding:'10px 14px',borderBottom:`1px solid ${D}`}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
        <div>
          <div style={{fontSize:13,color:'#9090a8'}}>{label}</div>
          {sub&&<div style={{fontSize:10,color:'#5a5a72',marginTop:1}}>{sub}</div>}
        </div>
        <div style={{fontFamily:'monospace',fontSize:12,color:'#e8e8f0'}}>{fmt?fmt(value):value}</div>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e=>onUpd(k,parseFloat(e.target.value))}
        style={{width:'100%',accentColor:'#7c6bff'}}/>
    </div>
  );
}

function App(){
  const [A,setA]=useState(()=>{try{const saved=localStorage.getItem('kcc_firelab_inputs');return saved?JSON.parse(saved):{...DEF};}catch(e){return {...DEF};}});
  const [sc,setSc]=useState('base_keep');
  const [tab,setTab]=useState('dash');
  const [savedScens,setSavedScens]=useState(()=>{try{const s=localStorage.getItem('kcc_firelab_saved');return s?JSON.parse(s):[];}catch(e){return [];}});
  const [saveLabel,setSaveLabel]=useState('');
  const [selM,setSelM]=useState(null);
  const [met,setMet]=useState('liq');
  const [actuals,setActuals]=useState(()=>{ try{ const imp=localStorage.getItem('kcc_fire_actuals'); if(imp){ const d=JSON.parse(imp); return d.map(a=>({month:a.mo,hf:a.actual||null,biz:null,rent:null,gift:null,spend:null,notes:a.notes||''})); } }catch(e){} return [{month:1,hf:150000,biz:null,rent:null,gift:null,spend:null,notes:'Starting balance Jun 2026'}]);
  const [editM,setEditM]=useState(1);

  // upd: Base Case writes to A (it IS the base)
  // All other scenarios write to their own ov — independently adjustable
  const [scenarios,setScenarios]=useState(SCENARIOS.map(s=>({...s})));
  function upd(k,v){
    if(sc==='base'){
      setA(prev=>({...prev,[k]:v}));
    } else {
      setScenarios(prev=>prev.map(s=>s.id===sc?{...s,ov:{...s.ov,[k]:v}}:s));
    }
  }

  function saveScenario(){
    if(!saveLabel.trim()){alert('Enter a name for this scenario');return;}
    const snap={id:'c_'+Date.now(),name:saveLabel.trim(),savedAt:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),base:sc,inputs:{...A}};
    const updated=[...savedScens,snap];
    setSavedScens(updated);
    setSaveLabel('');

                {[['Actual HF',FC(act.hf),hfCol],['Projected HF',FC(projHF),'#5a5a72'],['Difference',(hfD>=0?'+':'')+FC(hfD),hfCol],['% vs plan',((act.hf/projHF-1)*100).toFixed(1)+'%',hfCol]].map(([l,v,c])=>(
                  <div key={l} style={{background:'rgba(0,0,0,0.2)',borderRadius:7,padding:'8px 10px'}}>
                    <div style={{fontSize:9,textTransform:'uppercase',color:'#5a5a72',marginBottom:3}}>{l}</div>
                    <div style={{fontFamily:'monospace',fontSize:12,fontWeight:600,color:c}}>{v}</div>
                  </div>
                ))}
              </div>
            </>}
          </div>
          <div style={{background:bg2,border:`1px solid ${D}`,borderRadius:12,overflow:'hidden'}}>
            <div style={{padding:'9px 13px',borderBottom:`1px solid ${D}`,fontSize:9,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:'#5a5a72'}}>HF actual vs projected</div>
            {Array.from({length:12},(_,i)=>i+1).map(m=>{const a=getAct(m),pH=R.tl[m-1]?.liqHF||0,d=a.hf!=null?a.hf-pH:null;return(
              <div key={m} onClick={()=>setEditM(m)} style={{display:'grid',gridTemplateColumns:'55px 1fr 65px 50px',padding:'6px 13px',borderBottom:'1px solid rgba(255,255,255,0.04)',cursor:'pointer',background:m===editM?'rgba(124,107,255,0.06)':'none'}}>
                <div style={{fontFamily:'monospace',fontSize:10,color:m===editM?'#a08bff':'#5a5a72'}}>{MS(m)}</div>
                <div style={{fontFamily:'monospace',fontSize:10,color:'#3a3a50'}}>proj {FC(pH)}</div>
                <div style={{fontFamily:'monospace',fontSize:10,color:a.hf!=null?'#e8e8f0':'#3a3a50'}}>{a.hf!=null?FC(a.hf):'—'}</div>
                <div style={{fontFamily:'monospace',fontSize:10,color:d==null?'#3a3a50':d>=0?'#3dd68c':'#f87171',textAlign:'right'}}>{d==null?'':d>=0?'+'+FC(d):FC(d)}</div>
              </div>
            );})}
          </div>
        </div>
      </div>
    </div>
    );
  };

  return(
    <div style={{background:'#0c0c0f',minHeight:'100vh',paddingBottom:65}}>
      <div style={{padding:'14px 20px 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,letterSpacing:'0.08em',color:'#5a5a72',textTransform:'uppercase'}}>FIRE<span style={{color:'#7c6bff'}}>·</span>Lab <span style={{fontWeight:400,color:'#3a3a50'}}>v3</span></div>
          <div style={{fontSize:10,color:'#3a3a50',marginTop:1}}>Strategic Freedom Simulator · Jun 2026</div>
        </div>
        <div style={{width:6,height:6,borderRadius:'50%',background:'#3dd68c',boxShadow:'0 0 8px #3dd68c'}}/>
      </div>
      <div style={{display:'flex',gap:4,padding:'10px 20px 0'}}>
        {[['dash','Dashboard'],['inputs','Inputs'],['timeline','Timeline'],['compare','Compare'],['actuals','Actuals']].map(([id,l])=>(
          <button key={id} style={tabS(tab===id)} onClick={()=>setTab(id)}>{l}</button>
        ))}
      </div>
      {tab==='dash'&&<Dash/>}
      {tab==='inputs'&&<Inputs/>}
      {tab==='timeline'&&<Timeline/>}
      {tab==='compare'&&<Compare/>}
      {tab==='actuals'&&<Actuals/>}
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'rgba(12,12,15,0.95)',borderTop:`1px solid ${D}`,display:'flex',zIndex:100,backdropFilter:'blur(12px)'}}>
        {[['dash','⬡','Dashboard'],['inputs','⊞','Inputs'],['timeline','◌','Timeline'],['compare','⊠','Compare'],['actuals','◎','Actuals']].map(([id,ic,l])=>(
          <button key={id} onClick={()=>setTab(id)} style={navS(tab===id)}>
            <span style={{fontSize:17}}>{ic}</span><span>{l}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<div id="fl-ai-block" style="display:none;max-width:1100px;margin:16px auto;border:1px solid #3a2a5a;background:linear-gradient(135deg,#0e0a1a,#160e22);padding:14px 16px;">
  <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#9a78cc;margin-bottom:8px;">✦ AI FIRE Lab Analysis</div>
  <div id="fl-ai-text" style="font-size:12px;color:#ddd0f0;line-height:1.7;font-family:Libre Baskerville,sans-serif;font-style:italic;">Click "AI Analysis" above to get a scenario recommendation.</div>
</div>

<script>
async function fireLabAI() {
  const key = document.getElementById('fl-apikey').value.trim();
  if(!key){ alert('Paste your Claude API key in the field above'); return; }
  const block = document.getElementById('fl-ai-block');
  const tx    = document.getElementById('fl-ai-text');
  block.style.display = 'block';
  tx.textContent = 'Analyzing your FIRE scenarios…';

  // Get current scenario data from the React app state if possible
  const prompt = `You are the FIRE advisor for Sonny Koliwad. He has 10 scenarios modeled:
- Base Keep: Leave JPL Jun 2026, $17.5K biz income starts Mo.7, keep Paulette, 12% HF ROI
- Conservative Keep: Leave Dec 2026, $10K biz starts Mo.12, keep Paulette, 8% ROI
- Medium Keep: Leave Sep 2026, $15K biz starts Mo.9, keep Paulette, 10% ROI  
- Aggressive Keep: Leave Jun 2026, $22K biz starts Mo.5, keep Paulette, 13% ROI
- Same 4 scenarios × Sell Paulette (net ~$1.1M injected into HF)
- Skip SDI and Skip PTO+SDI variants

Starting balances: HF $150K, TIAA $420K (transfers Mo.13), HELOC $630K @ 6.5%, Vineta equity $800K, gift $8K/mo, rent $6.5K/mo.

Provide a 4-5 sentence analysis: (1) which scenario gives the best risk-adjusted FIRE date, (2) what single assumption matters most across all scenarios, (3) the biggest downside risk in the Base Keep scenario, (4) one concrete recommendation for this week based on the scenario modeling. Be specific with numbers and months.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    tx.textContent = data.content[0].text;
    tx.style.fontStyle = 'normal';
  } catch(e) {
    tx.textContent = 'Error: '+e.message;
  }
}
</script>
